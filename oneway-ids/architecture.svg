<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4ac7ff"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12335e"/><stop offset="1" stop-color="#0e4a6e"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="620" fill="#0b1220"/>
  <text x="30" y="36" fill="#dbe4f0" font-size="20" font-weight="bold">One-Way NIDS — Architecture (PS-26145)</text>
  <text x="30" y="58" fill="#7d8db0" font-size="12">read-only ingest · no decryption · streaming with bounded latency · all features one-way-native</text>

  <!-- Row 1: ingest -->
  <rect x="30" y="80" width="180" height="64" rx="8" fill="#121c30" stroke="#1e2c48"/>
  <text x="120" y="106" fill="#dbe4f0" font-size="13" text-anchor="middle" font-weight="bold">Data Diode</text>
  <text x="120" y="124" fill="#7d8db0" font-size="11" text-anchor="middle">one-way feed · read-only</text>

  <rect x="250" y="80" width="180" height="64" rx="8" fill="#121c30" stroke="#1e2c48"/>
  <text x="340" y="106" fill="#dbe4f0" font-size="13" text-anchor="middle" font-weight="bold">Ingest (dpkt)</text>
  <text x="340" y="124" fill="#7d8db0" font-size="11" text-anchor="middle">44,269 pkt/s measured</text>

  <rect x="470" y="80" width="220" height="64" rx="8" fill="#121c30" stroke="#1e2c48"/>
  <text x="580" y="106" fill="#dbe4f0" font-size="13" text-anchor="middle" font-weight="bold">Flow Assembler + Windows</text>
  <text x="580" y="124" fill="#7d8db0" font-size="11" text-anchor="middle">5-tuple flows · 10s windows · TLS/QUIC hooks</text>

  <rect x="730" y="80" width="200" height="64" rx="8" fill="#121c30" stroke="#1e2c48"/>
  <text x="830" y="106" fill="#dbe4f0" font-size="13" text-anchor="middle" font-weight="bold">Tier 0 — Allowlist</text>
  <text x="830" y="124" fill="#7d8db0" font-size="11" text-anchor="middle">operator-curated · zero cost</text>

  <line x1="210" y1="112" x2="246" y2="112" stroke="#4ac7ff" marker-end="url(#arr)"/>
  <line x1="430" y1="112" x2="466" y2="112" stroke="#4ac7ff" marker-end="url(#arr)"/>
  <line x1="690" y1="112" x2="726" y2="112" stroke="#4ac7ff" marker-end="url(#arr)"/>
  <line x1="930" y1="112" x2="970" y2="112" stroke="#4ac7ff" marker-end="url(#arr)"/>
  <text x="975" y="116" fill="#7d8db0" font-size="11">permitted flows</text>

  <!-- Row 2: detectors -->
  <text x="30" y="180" fill="#7d8db0" font-size="12">TIER 1 — STREAMING DETECTORS (every flow / window)</text>
  <g font-size="12">
    <rect x="30"  y="192" width="160" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="110" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(a) DDoS</text>
    <text x="110" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">rate + src-IP entropy</text>
    <text x="110" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">+ SYN ratio</text>

    <rect x="206" y="192" width="160" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="286" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(b) C2 Beacon</text>
    <text x="286" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">IAT mean / CV</text>
    <text x="286" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">jitter-scaled gate</text>

    <rect x="382" y="192" width="160" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="462" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(c) DGA / DNS</text>
    <text x="462" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">entropy + vowel/digit</text>
    <text x="462" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">profile + streak</text>

    <rect x="558" y="192" width="170" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="643" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(d) TLS + QUIC</text>
    <text x="643" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">JA4/JA3 fingerprints</text>
    <text x="643" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">intel match + novelty</text>

    <rect x="744" y="192" width="160" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="824" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(e) Recon / Scan</text>
    <text x="824" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">fan-out cardinality</text>
    <text x="824" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">+ dominant-dst class</text>

    <rect x="920" y="192" width="150" height="72" rx="8" fill="#12253a" stroke="#1e4a6e"/>
    <text x="995" y="216" fill="#4ac7ff" text-anchor="middle" font-weight="bold">(f) Exfil</text>
    <text x="995" y="234" fill="#9fb3d9" font-size="10" text-anchor="middle">bytes vs baseline</text>
    <text x="995" y="250" fill="#9fb3d9" font-size="10" text-anchor="middle">+ dst novelty/age</text>
  </g>

  <!-- Row 3: tier 2 + fusion -->
  <text x="30" y="300" fill="#7d8db0" font-size="12">TIER 2 — CONFIRM</text>
  <rect x="30" y="312" width="300" height="64" rx="8" fill="#122a3a" stroke="#1e6e5a"/>
  <text x="180" y="338" fill="#69d98c" font-size="13" text-anchor="middle" font-weight="bold">LightGBM scorer (INT8-ready)</text>
  <text x="180" y="356" fill="#9fb3d9" font-size="11" text-anchor="middle">temporal-split trained · micro-batched · 10.1k flow/s</text>

  <rect x="380" y="312" width="380" height="64" rx="8" fill="#2a1a30" stroke="#6e3a8e"/>
  <text x="570" y="338" fill="#d9a0ff" font-size="13" text-anchor="middle" font-weight="bold">Fusion — cross-correlate signals</text>
  <text x="570" y="356" fill="#b893cc" font-size="11" text-anchor="middle">noisy-OR · decayed confidence · fire-on-escalation · MITRE-style tags</text>

  <line x1="330" y1="344" x2="376" y2="344" stroke="#4ac7ff" marker-end="url(#arr)"/>
  <line x1="760" y1="344" x2="820" y2="344" stroke="#4ac7ff" marker-end="url(#arr)"/>

  <!-- Row 4: alert + dashboard -->
  <rect x="820" y="312" width="250" height="64" rx="8" fill="#3d1220" stroke="#ff5470"/>
  <text x="945" y="338" fill="#ff5470" font-size="13" text-anchor="middle" font-weight="bold">Standardized Alerts (JSONL)</text>
  <text x="945" y="356" fill="#c98a97" font-size="11" text-anchor="middle">ts · flow-id · class · confidence · severity · evidence</text>

  <rect x="30" y="410" width="1040" height="180" rx="10" fill="#101a2e" stroke="#1e2c48"/>
  <text x="50" y="438" fill="#dbe4f0" font-size="14" font-weight="bold">Measured results (single CPU core, pure Python)</text>
  <g fill="#9fb3d9" font-size="12">
    <text x="60" y="468">• 44,269 pkt/s · 18,077 flow/s rules-only — 2,113× real-time (600s capture in 0.28s)</text>
    <text x="60" y="490">• 24,687 pkt/s · 10,081 flow/s with the ML tier scoring every flow</text>
    <text x="60" y="512">• 6/6 PS threat classes · 295 unit tests · dpkt/scapy parity IDENTICAL</text>
    <text x="60" y="534">• 0 false positives after operator allowlisting (FP-pressure tested)</text>
    <text x="60" y="556">• Demo beats: QUIC channel migration re-alerts · fusion mints</text>
    <text x="75" y="573">"confirmed_c2_implant" (conf 0.999) from two weak signals · replayable dashboard</text>
  </g>
</svg>
