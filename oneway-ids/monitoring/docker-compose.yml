# Prometheus + Grafana stack for the one-way NIDS sensor.
#
#   docker compose up -d          from this directory
#
# The stack expects the sensor to publish /metrics (run.py --metrics-port
# 9100) on the docker host by default; see prometheus/prometheus.yml for how
# to point it at a remote sensor.
#
# Grafana:  http://localhost:3000   (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
#           the NIDS Overview dashboard is provisioned automatically.
# Prometheus UI: http://localhost:9090

name: nids-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.1        # LTS line
    container_name: nids-prometheus
    # Host networking: the sensor exports on the host's :9100, and this host's
    # firewall drops bridge->host traffic to arbitrary ports (host.docker.internal
    # and the docker0/br-net gateways both time out), so a bridged Prometheus
    # cannot scrape it without a root firewall change. On localhost everything
    # is reachable with no root. If you move the sensor to another host, revert
    # to bridged networking and point the target at it in prometheus.yml.
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.11
    container_name: nids-grafana
    # host networking for the same reason: the datasource must reach the
    # host-net Prometheus on localhost, and :3000 is free on the host.
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # land straight on the sensor dashboard
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/nids-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
