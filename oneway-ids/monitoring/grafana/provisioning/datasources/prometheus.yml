apiVersion: 1

# Datasource is provisioned read-only on container start -- no clicking.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: nids-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s        # match the scrape interval
      httpMethod: POST
