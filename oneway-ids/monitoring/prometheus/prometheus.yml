# Prometheus scrape configuration for the one-way NIDS.
#
# The sensor publishes /metrics when started with:
#   run.py --metrics-port 9100          (works for live, --pipe, or replay)
#
# Replay as a batch job: the sensor's counters are process-lifetime and reset
# with every replay, and the replayed stream time is not wall time, so
# `honor_timestamps: false` is required either way -- the exporter never
# sets explicit timestamps, but with the default `true` Prometheus would
# reject samples older than ~10 minutes, which every long replay is.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nids
    honor_timestamps: false
    static_configs:
      # sensor on this host (run.py --metrics-port 9100); prometheus runs with
      # host networking, so localhost is the host itself
      - targets: ["localhost:9100"]
        labels:
          sensor: local
    # Multiple sensors: add a static entry or a file_sd block per host, e.g.
    # file_sd_configs:
    #   - files: ["/etc/prometheus/targets/*.yml"]
